spring:
  application:
    name: fincli-backend

  datasource:
    # Credenciais nunca ficam no repositório (ADR 0008). Defina as variáveis de
    # ambiente antes de subir — ver backend/README.md.
    url: ${FINCLI_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=fincli;encrypt=true;trustServerCertificate=true}
    username: ${FINCLI_DB_USER}
    password: ${FINCLI_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    # O schema é do Flyway. Hibernate apenas valida que as entidades batem com o banco.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${FINCLI_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Exige HTTPS. Em desenvolvimento sobre http://localhost, sobrescreva com
        # FINCLI_COOKIE_SECURE=false.
        secure: ${FINCLI_COOKIE_SECURE:true}

fincli:
  cors:
    # Origem do SPA em desenvolvimento (Vite).
    origens: ${FINCLI_CORS_ORIGENS:http://localhost:5173}

logging:
  level:
    root: INFO
