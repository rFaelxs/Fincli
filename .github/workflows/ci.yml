name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Inclui os *IT, que sobem um SQL Server no Docker do runner.
      - name: Rodar testes
        run: mvn -B verify

      - name: Rodar Checkstyle
        run: mvn checkstyle:check
