# SQL Server para quem não tem uma instância local.
# Uso: MSSQL_SA_PASSWORD='<senha forte>' docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fincli-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Sem valor padrão de propósito: credencial não vai para o repositório.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD antes de subir}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - fincli-mssql:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  fincli-mssql:
